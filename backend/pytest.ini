[pytest]
# Tests live in tests/. The check_*.py scripts in scripts/ are a different
# thing - they talk to the real database and are run on their own (see
# docs/guides/RUN-AND-TEST.md). Keeping them apart means `pytest` is always
# fast and safe to run, with no network and nothing to clean up.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marks, so a slow or online layer can be skipped:
#   pytest -m "not online"   everything that needs no network
markers =
    unit: pure functions, no database, no network, milliseconds
    contract: HTTP routes through FastAPI's TestClient, no live server
    security: authentication, authorisation, tenant isolation, injection, PII
    online: needs the real database or a model provider

addopts =
    -q
    --strict-markers
    --tb=short
